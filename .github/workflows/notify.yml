name: Phone notifications
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency: notify
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/notify
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: .github/notify
      - run: node notify.mjs
        working-directory: .github/notify
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
